[project]
name = "spot-the-forgery"
version = "0.1.0"
description = "Daily puzzle generator for Spot the Forgery"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pydantic==2.14.1",
]

[project.scripts]
stf = "spot_the_forgery.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "pyright==1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spot_the_forgery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=spot_the_forgery --cov-branch --cov-fail-under=80"

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
